name: Redactor
options:
  bundleIdPrefix: com.desertant
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.10.0
  DesertAntCore:
    url: https://github.com/Desert-Ant-Labs/desert-ant-core.git
    from: 3.6.0
  DesertAntSwift:
    url: https://github.com/Desert-Ant-Labs/desert-ant-swift.git
    from: 2.1.3

targets:
  Redactor:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/AppIcon.icon
      - path: App/Assets.xcassets
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: DesertAntCore
        product: Redact
      - package: DesertAntSwift
        product: DesertAntUI
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Redactor
        NSHumanReadableCopyright: © 2026 Desert Ant Labs B.V. Redactor is MIT licensed. The models are under the Desert Ant Labs Source-Available License.
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        # A menu bar app: no Dock icon, and it never takes focus from the app
        # being pasted into.
        LSUIElement: true
        SUFeedURL: https://github.com/Desert-Ant-Labs/demo-redactor/releases/latest/download/appcast.xml
        SUPublicEDKey: W6J9bh7OT4fjiPjLiH3CjXMsEUK5esRKVZ/3d/hO6dY=
        SUEnableAutomaticChecks: true
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.desertant.redactor
        PRODUCT_NAME: Redactor
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        # The event tap and the clipboard reads need an app outside the sandbox.
        ENABLE_APP_SANDBOX: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RedactorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App/Sources/Guarding
    dependencies:
      - package: DesertAntCore
        product: Redact
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.desertant.redactor.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
